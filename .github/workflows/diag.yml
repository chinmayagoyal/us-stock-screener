name: diag
on:
  workflow_dispatch:
    inputs:
      tickers: {description: "tickers", required: true, default: "TMUS CVX NVDA XOM PFE MRK"}
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements.txt
      - run: python -m screener.diag ${{ github.event.inputs.tickers }}
        env:
          SEC_USER_AGENT: "US Stock Screener personal research ${{ secrets.SEC_CONTACT_EMAIL }}"
