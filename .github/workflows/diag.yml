name: diag
on: workflow_dispatch
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for ua in "us-stock-screener github.com/chinmayagoyal/us-stock-screener chinmayagoyal@users.noreply.github.com" "Chinmaya Goyal chinmayagoyal@users.noreply.github.com" "Personal Research chinmaya.goyal@gmail.com" "Mozilla/5.0 (compatible; research; chinmaya.goyal@gmail.com)"; do
            echo "UA=$ua -> tickers $(curl -s -o /dev/null -w '%{http_code}' -A "$ua" https://www.sec.gov/files/company_tickers.json) facts $(curl -s -o /dev/null -w '%{http_code}' -A "$ua" https://data.sec.gov/api/xbrl/companyfacts/CIK0000320193.json)"
            sleep 1
          done
          curl -s -A "Chinmaya Goyal chinmayagoyal@users.noreply.github.com" https://www.sec.gov/files/company_tickers.json | head -c 300
